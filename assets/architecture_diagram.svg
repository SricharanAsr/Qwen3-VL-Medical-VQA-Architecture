<text x="20" y="166" fill="#38bdf8" font-size="10" font-family="monospace">L1=1.0x | L2=1.5x | L3=2.0x</text>
<text x="20" y="184" fill="#38bdf8" font-size="10" font-family="monospace">Enforces deep feature attention</text>
